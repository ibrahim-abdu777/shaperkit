[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shaperkit"
version = "0.1.1"
description = "Unicode-aware display width and line splitting helpers"
requires-python = ">=3.8"
license = { text = "MIT" }

[tool.setuptools]
packages = ["shaperkit"]
